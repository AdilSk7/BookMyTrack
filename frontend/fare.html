<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookMyTrack – Fare Enquiry</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="fare.css"/>
  <script src="api.js"></script>
  <script src="auth-guard.js" defer></script>

</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="logo">BookMyTrack</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="reservation.html">Reservation</a>
      <a href="schedule.html">Schedule</a>
      <a href="fare.html">Fare</a>
      <a href="pnr.html">PNR</a>
      <a href="mybookings.html">My Bookings</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="buttons" id="nav-cta"></div>
  </nav>

  <div class="fare-wrap">
    <h1>Fare Enquiry</h1>

    <div class="card">
      <div class="grid">
        <label>From Station
          <input id="from" list="stations" placeholder="e.g., MUMBAI CST" />
        </label>
        <label>To Station
          <input id="to" list="stations" placeholder="e.g., PUNE JN" />
        </label>

        <label>Class
          <select id="cls">
            <option value="2S">2S (Second Seating)</option>
            <option value="SL" selected>SL (Sleeper)</option>
            <option value="3A">3A (AC 3 Tier)</option>
            <option value="2A">2A (AC 2 Tier)</option>
            <option value="1A">1A (First AC)</option>
            <option value="CC">CC (AC Chair Car)</option>
          </select>
        </label>

        <label>Quota
          <select id="quota">
            <option value="GEN" selected>General</option>
            <option value="SENIOR">Senior Citizen</option>
            <option value="CHILD">Child (&lt; 12 yrs)</option>
            <option value="DIVYANG">Divyang (PwD)</option>
          </select>
        </label>

        <label>Distance (km)
          <input id="distance" type="number" min="1" placeholder="Auto or enter manually"/>
          <span class="note">We auto-estimate for common routes; you can override.</span>
        </label>

        <label>Passengers
          <input id="pax" type="number" min="1" value="1"/>
        </label>
      </div>

      <div class="mt-16">
        <div class="row">
          <button class="btn btn-ghost" id="addPax">+ Add Passenger Details (optional)</button>
          <button class="btn btn-primary" id="calc">Calculate Fare</button>
        </div>
      </div>
    </div>

    <div id="paxBox" class="card mt-12" style="display:none;">
      <strong>Passenger Details (for mixed concessions)</strong>
      <div id="paxList" class="passenger-list mt-12"></div>
    </div>

    <div id="result" class="card mt-16" style="display:none;">
      <strong>Fare Breakdown</strong>
      <div class="breakdown mt-12" id="breakdown"></div>
    </div>
  </div>

  <datalist id="stations">
    <option>MUMBAI CST</option>
    <option>PUNE JN</option>
    <option>DELHI</option>
    <option>KANPUR</option>
    <option>LUCKNOW</option>
    <option>HOWRAH</option>
    <option>SEALDAH</option>
    <option>CHENNAI CENTRAL</option>
    <option>BENGALURU CITY</option>
    <option>HYDERABAD</option>
    <option>SECUNDERABAD</option>
    <option>AHMEDABAD</option>
    <option>JAIPUR</option>
    <option>BHOPAL</option>
    <option>VARANASI</option>
  </datalist>

  <footer>&copy; 2024 Railway Reservation Management System. All rights reserved.</footer>

  <script>
    // A tiny "distance atlas" for popular pairs; otherwise user can type distance
    const KM = {
      'MUMBAI CST|PUNE JN': 192,
      'MUMBAI CST|AHMEDABAD': 493,
      'DELHI|KANPUR': 440,
      'DELHI|LUCKNOW': 512,
      'HOWRAH|SEALDAH': 8,
      'CHENNAI CENTRAL|BENGALURU CITY': 362,
      'DELHI|JAIPUR': 280,
      'DELHI|VARANASI': 760,
      'SECUNDERABAD|HYDERABAD': 10
    };

    // Simple class multipliers (illustrative, not official)
    const CLASS_MULT = {
      '2S': 0.45,
      'SL': 0.60,
      '3A': 1.0,
      '2A': 1.35,
      '1A': 2.2,
      'CC': 0.95
    };

    // Concessions (illustrative)
    // Applied per-passenger on base*mult, before taxes
    const CONCESSION = {
      'GEN': 0.0,
      'SENIOR': 0.40,   // 40% off
      'CHILD': 0.50,    // 50% off (<12)
      'DIVYANG': 0.50   // 50% off
    };

    const GST_RATE = 0.05; // 5% on AC classes (3A/2A/1A/CC), 0% otherwise
    const MIN_FARE = 50;   // minimum fare floor per passenger

    // Elements
    const fromEl = document.getElementById('from');
    const toEl   = document.getElementById('to');
    const clsEl  = document.getElementById('cls');
    const quotaEl= document.getElementById('quota');
    const distEl = document.getElementById('distance');
    const paxEl  = document.getElementById('pax');
    const calcBtn= document.getElementById('calc');

    const paxBox = document.getElementById('paxBox');
    const paxList= document.getElementById('paxList');
    const addPaxBtn = document.getElementById('addPax');

    const result = document.getElementById('result');
    const breakdown = document.getElementById('breakdown');

    // Auto-estimate distance when from/to change
    function tryAutoDistance(){
      const key = `${fromEl.value.trim().toUpperCase()}|${toEl.value.trim().toUpperCase()}`;
      const rev = `${toEl.value.trim().toUpperCase()}|${fromEl.value.trim().toUpperCase()}`;
      if(KM[key]) distEl.value = KM[key];
      else if(KM[rev]) distEl.value = KM[rev];
    }
    fromEl.addEventListener('change', tryAutoDistance);
    toEl.addEventListener('change', tryAutoDistance);

    // Optional per-passenger granularity
    addPaxBtn.addEventListener('click', () => {
      paxBox.style.display = 'block';
      const n = Number(paxEl.value || 1);
      if (paxList.children.length >= n) return;
      // Add rows until count = pax
      while (paxList.children.length < n) {
        addPassengerRow();
      }
    });

    function addPassengerRow(){
      const row = document.createElement('div');
      row.className = 'pass-row';
      row.innerHTML = `
        <input placeholder="Passenger Name (optional)">
        <select class="pax-quota">
          <option value="GEN">General</option>
          <option value="SENIOR">Senior</option>
          <option value="CHILD">Child (&lt;12)</option>
          <option value="DIVYANG">Divyang</option>
        </select>
        <select class="pax-class">
          <option value="2S">2S</option>
          <option value="SL" selected>SL</option>
          <option value="3A">3A</option>
          <option value="2A">2A</option>
          <option value="1A">1A</option>
          <option value="CC">CC</option>
        </select>
        <input type="number" class="pax-age" min="1" placeholder="Age (optional)">
        <button class="btn btn-danger remove" type="button">×</button>
      `;
      row.querySelector('.remove').onclick = () => row.remove();
      paxList.appendChild(row);
    }

    // Core fare math for one passenger
    function fareForOne(distanceKm, cls, quota){
      const basePerKm = 0.9; // base ₹/km (illustrative)
      const base = Math.max(MIN_FARE, distanceKm * basePerKm);
      const classMult = CLASS_MULT[cls] ?? 1.0;
      const gross = base * classMult;

      // concession
      const offRate = CONCESSION[quota] ?? 0;
      const afterConcession = gross * (1 - offRate);

      // GST on AC classes only
      const acClasses = new Set(['3A','2A','1A','CC']);
      const gst = acClasses.has(cls) ? afterConcession * GST_RATE : 0;

      const total = Math.round(afterConcession + gst);
      return { base, classMult, gross, offRate, afterConcession, gst, total };
    }

    function renderBreakdown(lines){
      breakdown.innerHTML = '';
      let grand = 0;
      lines.forEach((ln, idx) => {
        grand += ln.total;
        const wrap = document.createElement('div');
        wrap.className = 'line';
        wrap.innerHTML = `
          <div>
            <strong>P${idx+1}:</strong> ${ln.from} → ${ln.to}
            &nbsp;•&nbsp; ${ln.cls} &nbsp;•&nbsp; ${ln.quota}
            <div class="note">Base ₹${ln.base.toFixed(2)} × ${ln.classMult} → ₹${ln.gross.toFixed(2)}
              ${ln.offRate>0 ? ` • Concession −${Math.round(ln.offRate*100)}%` : ''}
              ${ln.gst>0 ? ` • GST ₹${ln.gst.toFixed(2)}` : ''}</div>
          </div>
          <div><strong>₹${ln.total}</strong></div>
        `;
        breakdown.appendChild(wrap);
      });

      const totalEl = document.createElement('div');
      totalEl.className = 'line total';
      totalEl.innerHTML = `<div>Total</div><div>₹${grand}</div>`;
      breakdown.appendChild(totalEl);
    }

    function calculate(){
      const from = fromEl.value.trim();
      const to   = toEl.value.trim();
      const cls  = clsEl.value;
      const quota= quotaEl.value;
      const n    = Math.max(1, Number(paxEl.value || 1));
      const dist = Math.max(1, Number(distEl.value || 0));

      if(!from || !to){
        alert('Please enter From and To stations.');
        return;
      }
      if(!dist || isNaN(dist)){
        alert('Please enter distance (km).');
        return;
      }

      // If detailed pax rows are used, compute per row; else use global settings
      const rows = [...paxList.querySelectorAll('.pass-row')];
      const lines = [];

      if(rows.length > 0){
        rows.forEach(r => {
          const pCls = r.querySelector('.pax-class').value || cls;
          const pQuota = r.querySelector('.pax-quota').value || quota;
          const calc = fareForOne(dist, pCls, pQuota);
          lines.push({ ...calc, from, to, cls: pCls, quota: pQuota });
        });
        // If fewer rows than pax count, assume remaining are default quota/class
        for(let i=rows.length; i<n; i++){
          const calc = fareForOne(dist, cls, quota);
          lines.push({ ...calc, from, to, cls, quota });
        }
      } else {
        for(let i=0;i<n;i++){
          const calc = fareForOne(dist, cls, quota);
          lines.push({ ...calc, from, to, cls, quota });
        }
      }

      renderBreakdown(lines);
      result.style.display = 'block';
    }

    // Auto distance on blur/change
    [fromEl, toEl].forEach(el => el.addEventListener('blur', tryAutoDistance));
    calcBtn.addEventListener('click', calculate);
  </script>

  <script>
  // highlight active link
  (function(){
    const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    document.querySelectorAll('nav .links a').forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      if (href === path) a.classList.add('active');
    });
  })();

  // shrink nav on scroll
  (function(){
    const nav = document.querySelector('nav');
    const onScroll = () => nav.classList.toggle('nav--scrolled', window.scrollY > 10);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
  })();
</script>

</body>
</html>
