<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookMyTrack - PNR Status</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pnr.css" />
  <link rel="stylesheet" href="reservation.css" />
  <script src="auth-guard.js" defer></script>
  <script src="api.js"></script>

</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="logo">BookMyTrack</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="reservation.html">Reservation</a>
      <a href="schedule.html">Schedule</a>
      <a href="fare.html">Fare</a>
      <a href="pnr.html">PNR</a>
      <a href="mybookings.html">My Bookings</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html">Admin</a>
    </div>
    <div class="buttons" id="nav-cta"></div>
  </nav>

  <!-- PNR Status Section -->
  <div class="pnr-container">
    <h1>Check PNR Status</h1>
    <form id="pnrForm">
      <input type="text" id="pnrInput" placeholder="Enter 6-digit PNR" maxlength="6" required />
      <button type="submit" id="pnrBtn">Check Status</button>
    </form>

    <div id="pnrResult" class="pnr-result"></div>
  </div>

  <footer>&copy; 2024 Railway Reservation Management System. All rights reserved.</footer>

  <script>
    const pnrForm   = document.getElementById('pnrForm');
    const pnrInput  = document.getElementById('pnrInput');
    const pnrBtn    = document.getElementById('pnrBtn');
    const pnrResult = document.getElementById('pnrResult');

    // keep input uppercase while typing
    pnrInput.addEventListener('input', () => {
      pnrInput.value = pnrInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    });

    // Fallback amount (only if server has no fare fields)
    function fallbackAmount(paxCount) {
      return 449 + Math.max(0, (paxCount || 1) - 1) * 250;
    }

    pnrForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const raw = pnrInput.value.trim().toUpperCase();
      const pnr = raw.replace(/[^A-Z0-9]/g,'').slice(0,6);

      if (!pnr || pnr.length !== 6) {
        pnrResult.innerHTML = `<p style="color:red;">Enter a valid 6-character PNR.</p>`;
        return;
      }

      try {
        pnrBtn.disabled = true;
        pnrResult.innerHTML = `<p style="color:gray;">Fetching status...</p>`;

        const res  = await fetch(`${API_BASE}/api/reservation/pnr/${pnr}`);
        const data = await res.json();

        if (!res.ok) {
          pnrResult.innerHTML = `<p style="color:red;">${data.error || 'PNR not found'}</p>`;
          return;
        }

        // Compute total fare with server-first approach
        const paxArray = Array.isArray(data.passengers) ? data.passengers : [];
        const paxCount = paxArray.length || 1;
        const totalFare = (typeof data.fareTotal === 'number' && data.fareTotal > 0)
          ? data.fareTotal
          : fallbackAmount(paxCount);
        const currency = data.currency || 'INR';

        // Optional per-passenger breakdown if present & aligned
        let breakdownHTML = '';
        if (Array.isArray(data.farePerPax) && data.farePerPax.length === paxArray.length) {
          breakdownHTML = `
            <div class="fare-breakdown">
              <i>Per passenger:</i>
              <ul>
                ${paxArray.map((p, i) => {
                  const f = data.farePerPax[i];
                  return `<li>${p.name || 'Passenger'} — ₹${f}</li>`;
                }).join('')}
              </ul>
            </div>
          `;
        }

        // Build passenger list with coach-seat info
        let passengersHTML = '';
        if (paxArray.length > 0) {
          passengersHTML =
            `<b>Passengers:</b><ul>` +
            paxArray.map(p => {
              const berth =
                p.berthAllocated
                  ? p.berthAllocated
                  : (p.berthPreference ? p.berthPreference : 'auto');

              const seatLabel = (p.coach && p.seatNumber)
                ? ` — ${p.coach}-${p.seatNumber}`
                : (p.seatLabel ? ` — ${p.seatLabel}` : '');

              const tags = [
                p.needsWheelchair ? '🦽' : '',
                p.needsPrioritySeat ? '⭐' : '',
                p.groupId ? `[Group: ${p.groupId}]` : '',
                Number.isInteger(p.companionOf) ? `(Companion of #${p.companionOf})` : ''
              ].filter(Boolean).join(' ');

              return `<li>${p.name} (${p.age}, ${p.gender}, ${berth}${seatLabel}) ${tags}</li>`;
            }).join('') +
            `</ul>`;
        }

        pnrResult.innerHTML = `
          <div class="pnr-card">
            <h3>PNR: ${data.pnr}</h3>
            <p><b>From:</b> ${data.from} &nbsp;&nbsp; <b>To:</b> ${data.to}</p>
            <p><b>Date:</b> ${new Date(data.journeyDate).toDateString()}</p>
            <p><b>Status:</b> <span class="status-${String(data.status || '').toLowerCase()}">${data.status}</span></p>

            <div class="fare-block">
              <b>Total Fare:</b> ₹${totalFare} <span class="muted">(${currency})</span>
              ${breakdownHTML}
            </div>

            ${passengersHTML}
          </div>
        `;
      } catch (err) {
        console.error(err);
        pnrResult.innerHTML = `<p style="color:red;">Server error</p>`;
      } finally {
        pnrBtn.disabled = false;
      }
    });
  </script>

  <script>
  // highlight active link
  (function(){
    const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    document.querySelectorAll('nav .links a').forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      if (href === path) a.classList.add('active');
    });
  })();

  // shrink nav on scroll
  (function(){
    const nav = document.querySelector('nav');
    const onScroll = () => nav.classList.toggle('nav--scrolled', window.scrollY > 10);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
  })();
</script>

</body>
</html>
