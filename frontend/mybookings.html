<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookMyTrack - My Bookings</title>

  <link rel="stylesheet" href="style.css" />
   <link rel="stylesheet" href="mybookings.css" />
  <link rel="stylesheet" href="reservation.css" /> <!-- reuse styling -->
  <script src="api.js"></script>
  <script src="auth-guard.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="logo">BookMyTrack</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="reservation.html">Reservation</a>
      <a href="schedule.html">Schedule</a>
      <a href="fare.html">Fare</a>
      <a href="pnr.html">PNR</a>
      <a href="mybookings.html">My Bookings</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="buttons" id="nav-cta"></div>
  </nav>

  <!-- My Bookings Section -->
  <div class="bookings-container">
    <h1>My Bookings</h1>
    <div id="bookingsList">Loading your bookings...</div>
  </div>

  <footer>&copy; 2024 Railway Reservation Management System. All rights reserved.</footer>

  <script>
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const bookingsList = document.getElementById('bookingsList');

    if (!user) {
      alert('Please login first!');
      location.href = 'login.html';
    } else {
      loadBookings();
    }

    // --- helpers ---

    // Prefer server fare; fallback to legacy client formula only if missing
    function fallbackAmount(paxCount) {
      return 449 + Math.max(0, (paxCount || 1) - 1) * 250;
    }

    function resolveTotalFare(b) {
      const paxCount = Array.isArray(b.passengers) ? b.passengers.length : 1;
      const fromServer = (typeof b.fareTotal === 'number') ? b.fareTotal : NaN;
      return Number.isFinite(fromServer) ? fromServer : fallbackAmount(paxCount);
    }

    // On Pay Now, send PNR, reservationId, and the total fare
    function goToPay(pnr, id, totalFare) {
      localStorage.setItem('lastPNR', pnr);
      localStorage.setItem('lastReservationId', id);
      localStorage.setItem('lastAmount', String(totalFare));
      location.href = 'payment.html';
    }

    async function loadBookings() {
      if (typeof API_BASE === 'undefined') {
        bookingsList.innerHTML =
          `<p style="color:red;">API_BASE is not defined. Make sure <b>api.js</b> is loaded.</p>`;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/reservation/user/${user._id}`);
        const raw = await res.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch { /* keep raw */ }

        if (!res.ok) {
          if (res.status === 404) {
            bookingsList.innerHTML =
              `<p class="muted">No bookings found yet.</p>
               <p><a href="reservation.html" style="color:#1d9bf0; font-weight:700;">Book now →</a></p>`;
          } else {
            const msg = (data && data.error) ? data.error : raw || 'Unknown error';
            bookingsList.innerHTML =
              `<p style="color:red;">Failed to fetch bookings (HTTP ${res.status}).</p>
               <pre class="muted" style="white-space:pre-wrap;">${msg}</pre>`;
          }
          return;
        }

        if (!Array.isArray(data) || data.length === 0) {
          bookingsList.innerHTML = `<p class="muted">No bookings found.</p>`;
          return;
        }

        bookingsList.innerHTML = '';
        data.forEach(b => {
          const div = document.createElement('div');
          div.className = 'booking-card';

          // render passenger list with seat & coach when available
          let passengerHTML = '';
          if (Array.isArray(b.passengers) && b.passengers.length > 0) {
            passengerHTML =
              `<b>Passengers:</b><ul style="margin:6px 0; padding-left:20px;">` +
              b.passengers.map(p => {
                const berth = p.berthAllocated
                  ? p.berthAllocated
                  : (p.berthPreference ? p.berthPreference : 'auto');

                const seatLabel = (p.coach && p.seatNumber)
                  ? ` — ${p.coach}-${p.seatNumber}`
                  : (p.seatLabel ? ` — ${p.seatLabel}` : '');

                const tags = [
                  p.needsWheelchair ? '🦽' : '',
                  p.needsPrioritySeat ? '⭐' : '',
                  p.groupId ? `[Group: ${p.groupId}]` : '',
                  Number.isInteger(p.companionOf) ? `(Companion of #${p.companionOf})` : ''
                ].filter(Boolean).join(' ');

                return `<li>${p.name} (${p.age}, ${p.gender}, ${berth}${seatLabel}) ${tags}</li>`;
              }).join('') +
              `</ul>`;
          }

          const statusClass = (b.status || '').toLowerCase(); // safe class
          const paxCount    = Array.isArray(b.passengers) ? b.passengers.length : 1;
          const totalFare   = resolveTotalFare(b);
          const currency    = b.currency || 'INR';

          // actions: Pay Now for Pending; Cancel for anything not cancelled
          let actions = '';
          if (statusClass === 'pending') {
            actions += `<button class="btn-pay" onclick="goToPay('${b.pnr}','${b._id}',${totalFare})">Pay Now</button>`;
          }
          if (statusClass !== 'cancelled') {
            actions += `<button class="btn-cancel" onclick="cancelBooking('${b._id}')">Cancel</button>`;
          }

          div.innerHTML = `
            <h3>PNR: ${b.pnr}</h3>
            <div class="booking-details">
              <b>From:</b> ${b.from} &nbsp;&nbsp; <b>To:</b> ${b.to}<br>
              <b>Date:</b> ${new Date(b.journeyDate).toDateString()}<br>
              <b>Status:</b> <span class="status-${statusClass}">${b.status}</span><br>
              <b>Total Fare:</b> ₹${totalFare} <span class="muted">(${currency})</span>
              <br>
              ${passengerHTML}
            </div>
            ${actions}
          `;
          bookingsList.appendChild(div);
        });
      } catch (err) {
        console.error('[MyBookings load error]', err);
        bookingsList.innerHTML =
          `<p style="color:red;">Network/parse error while loading bookings.</p>
           <pre class="muted" style="white-space:pre-wrap;">${err.message || err}</pre>`;
      }
    }

    async function cancelBooking(id) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;

      try {
        const res = await fetch(`${API_BASE}/api/reservation/cancel/${id}`, { method: 'DELETE' });
        const raw = await res.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch { /* keep raw */ }

        if (!res.ok) {
          const msg = (data && data.error) ? data.error : raw || 'Unknown error';
          alert(`Cancel failed (HTTP ${res.status}).\n${msg}`);
          return;
        }

        alert('Booking cancelled');
        loadBookings();
      } catch (err) {
        console.error('[Cancel error]', err);
        alert('Network/parse error while cancelling.\n' + (err.message || err));
      }
    }
  </script>

  <script>
  // highlight active link
  (function(){
    const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    document.querySelectorAll('nav .links a').forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      if (href === path) a.classList.add('active');
    });
  })();

  // shrink nav on scroll
  (function(){
    const nav = document.querySelector('nav');
    const onScroll = () => nav.classList.toggle('nav--scrolled', window.scrollY > 10);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
  })();
</script>

</body>
</html>
