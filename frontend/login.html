<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookMyTrack - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <script src="api.js"></script>
</head>
<body>

  <!-- Login Form -->
  <div class="login-container">
    <h1>Login</h1>
    <form id="loginForm" autocomplete="off">
      <label>Email:</label>
      <input type="email" name="email" placeholder="Enter your email" required autocomplete="off">

      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter your password" required autocomplete="off">

      <button type="submit">Login</button>
    </form>
    <div id="loginMessage"></div>

    <p>Don’t have an account? <a href="registration.html">Sign up here</a></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = loginForm.email.value.trim();
      const password = loginForm.password.value.trim();

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          loginForm.reset();
          loginMessage.style.color = 'green';
          loginMessage.innerText = 'Login successful! Redirecting...';

          // Save user info to localStorage
          localStorage.setItem('user', JSON.stringify(data.user));

          // Redirect to homepage
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 1000);
        } else {
          loginMessage.style.color = 'red';
          loginMessage.innerText = data.error || 'Login failed';
        }
      } catch (err) {
        console.error(err);
        loginMessage.style.color = 'red';
        loginMessage.innerText = 'Server error';
      }
    });
  </script>

  <!-- Footer -->
  <footer>
    &copy; 2024 Railway Reservation Management System. All rights reserved.
  </footer>
</body>
</html>
