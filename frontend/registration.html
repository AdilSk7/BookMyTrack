<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookMyTrack - Registration</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="registration.css">
  <script src="api.js"></script>
</head>
<body>

  <!-- Registration Form -->
  <div class="registration-container">
    <h1>Register</h1>
    <form id="registrationForm" autocomplete="off">
      <label>Full Name:</label>
      <input type="text" name="name" placeholder="Enter your full name" required autocomplete="off">

      <label>Email:</label>
      <input type="email" name="email" placeholder="Enter your email" required autocomplete="off">

      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter your password" required autocomplete="new-password">

      <label>Age:</label>
      <input type="number" name="age" min="1" required>

      <label>Gender:</label>
      <select name="gender" required>
        <option value="">Select</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <button type="submit">Register</button>
    </form>

    <div id="regMessage"></div>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    const regForm = document.getElementById('registrationForm');
    const regMessage = document.getElementById('regMessage');

    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const userData = {
        name: regForm.name.value.trim(),
        email: regForm.email.value.trim(),
        password: regForm.password.value,
        age: parseInt(regForm.age.value),
        gender: regForm.gender.value
      };

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        });

        const data = await res.json();

        if (res.ok) {
          regForm.reset();  

          regMessage.style.color = 'green';
          regMessage.innerText = 'Registration successful! Redirecting to login...';

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          regMessage.style.color = 'red';
          regMessage.innerText = data.error || 'Registration failed';
        }
      } catch (err) {
        console.error(err);
        regMessage.style.color = 'red';
        regMessage.innerText = 'Server error!';
      }
    });
  </script>

  <script>
  // highlight active link
  (function(){
    const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    document.querySelectorAll('nav .links a').forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      if (href === path) a.classList.add('active');
    });
  })();

  // shrink nav on scroll
  (function(){
    const nav = document.querySelector('nav');
    const onScroll = () => nav.classList.toggle('nav--scrolled', window.scrollY > 10);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
  })();
</script>


  <!-- Footer -->
  <footer>
    &copy; 2024 Railway Reservation Management System. All rights reserved.
  </footer>
</body>
</html>
