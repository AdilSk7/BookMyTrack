<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookMyTrack - Registration</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="registration.css">
  <script src="api.js"></script>
</head>
<body>

  <!-- Registration Form -->
  <div class="registration-container">
    <div class="registration-icon">
      <i class="fa-solid fa-user-plus"></i>
    </div>
    <h1>Create <span>Account</span></h1>
    <p class="subtitle">Join BookMyTrack and start your journey</p>

    <form id="registrationForm" autocomplete="off">
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="name" placeholder="Enter your full name" required autocomplete="off">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" name="email" placeholder="Enter your email" required autocomplete="off">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Create a password" required autocomplete="new-password">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-cake-candles"></i>
        <input type="number" name="age" min="1" placeholder="Enter your age" required>
      </div>

      <div class="input-group select-group">
        <i class="fa-solid fa-venus-mars"></i>
        <select name="gender" required>
          <option value="" disabled selected hidden>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <button type="submit">Complete Registration</button>
    </form>

    <div id="regMessage"></div>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    const regForm = document.getElementById('registrationForm');
    const regMessage = document.getElementById('regMessage');

    if (regMessage) {
      const observer = new MutationObserver(() => {
        if (regMessage.innerText.trim() !== '') {
          regMessage.style.display = 'block';
        } else {
          regMessage.style.display = 'none';
        }
      });
      observer.observe(regMessage, { childList: true, characterData: true, subtree: true });
    }

    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const userData = {
        name: regForm.name.value.trim(),
        email: regForm.email.value.trim(),
        password: regForm.password.value,
        age: parseInt(regForm.age.value),
        gender: regForm.gender.value
      };

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        });

        const data = await res.json();

        if (res.ok) {
          regForm.reset();  

          regMessage.style.backgroundColor = 'rgba(0, 255, 0, 0.1)';
          regMessage.style.borderColor = 'rgba(0, 255, 0, 0.3)';
          regMessage.style.color = '#33ff33';
          regMessage.innerText = 'Registration successful! Redirecting to login...';

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          regMessage.style.backgroundColor = 'rgba(255, 77, 77, 0.15)';
          regMessage.style.borderColor = 'rgba(255, 77, 77, 0.25)';
          regMessage.style.color = '#ff4d4d';
          regMessage.innerText = data.error || 'Registration failed';
        }
      } catch (err) {
        console.error(err);
        regMessage.style.backgroundColor = 'rgba(255, 77, 77, 0.15)';
        regMessage.style.borderColor = 'rgba(255, 77, 77, 0.25)';
        regMessage.style.color = '#ff4d4d';
        regMessage.innerText = 'Server error!';
      }
    });
  </script>

  <script>
  // highlight active link
  (function(){
    const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    document.querySelectorAll('nav .links a').forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      if (href === path) a.classList.add('active');
    });
  })();

  // shrink nav on scroll
  (function(){
    const nav = document.querySelector('nav');
    const onScroll = () => nav.classList.toggle('nav--scrolled', window.scrollY > 10);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
  })();
</script>


  <!-- Footer -->
  <footer>
    &copy; 2024 BookMyTrack. All rights reserved.
  </footer>
</body>
</html>
